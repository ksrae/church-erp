[package]
name = "church-erp"
version = "0.2.1"
description = "교회 관리 ERP 시스템"
authors = ["Church ERP Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "protocol-asset", "path-all", "fs-exists", "dialog-message", "dialog-confirm", "window-unmaximize", "fs-write-file", "window-hide", "fs-rename-file", "dialog-ask", "window-show", "window-start-dragging", "dialog-save", "window-minimize", "fs-read-file", "fs-remove-dir", "fs-create-dir", "fs-remove-file", "window-maximize", "dialog-open", "fs-copy-file", "window-unminimize", "window-close", "fs-read-dir", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
