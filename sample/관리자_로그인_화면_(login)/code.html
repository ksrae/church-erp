<main class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">

</div>
<div class="flex flex-col gap-1">

<p class="text-sm font-medium text-primary">관리자 로그인</p>

<p class="text-sm text-gray-600 dark:text-gray-400">

<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1" for="id">아이디</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-white/60 dark:bg-gray-800/50 pl-11 pr-4 py-3.5 text-base text-gray-900 dark:text-white placeholder-gray-400 focus:border-primary focus:ring-primary focus:ring-1 sm:text-sm transition-all shadow-sm" id="id" placeholder="admin@church.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1" for="password">비밀번호</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-white/60 dark:bg-gray-800/50 pl-11 pr-4 py-3.5 text-base text-gray-900 dark:text-white placeholder-gray-400 focus:border-primary focus:ring-primary focus:ring-1 sm:text-sm transition-all shadow-sm" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between py-1">
<div class="flex items-center gap-6">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0 cursor-pointer" type="checkbox"/>
<span class="text-sm text-gray-600 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-gray-200 transition-colors">아이디 저장</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0 cursor-pointer" type="checkbox"/>
<span class="text-sm text-gray-600 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-gray-200 transition-colors">자동 로그인</span>
</label>
</div>
</div>
<button class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-lg shadow-md shadow-primary/10 text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 transform hover:-translate-y-0.5" type="submit">
<span>로그인</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<div class="flex items-center justify-center gap-4 text-xs sm:text-sm text-gray-500 dark:text-gray-400">

<span class="text-[11px] font-medium text-gray-400 uppercase tracking-wider">Secure SSL Connection</span>
